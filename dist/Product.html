    <!--! HERE , FIRST I NEED TO CREATE ATLEAST A TEMPLATE FOR JUST ONE CARD, THAT FURTHER APPEND TO THE PRODUCTCONTAINER: -->

    <template class="CardTemplate">
        <div class="cards" id="cardValue">
            <article class="information [card]">
                <div class="Imagecontainer">
                    <img class="ProductImage" data-src="" alt="product_image">
                </div>
                <h2 class="Product-name"></h2>
                <div class="Product-Price-Element">
                    <div class="Product-Price"></div>
                    <div class="Product-Actual-Price"></div>
                </div>
                <div class="Product-Stock-Element">
                    <p class="Stock-head">Total Stock:</p>
                    <p class="Stock-value"></p>
                </div>

                <div class="Stock-Counter-Element">
                    <p>Qunatity (Pieces) :</p>
                    <div class="stockcounter">
                        <button class="Count-Decrement">-</button>
                        <p class="Count-Value">1</p>
                        <button class="Count-Increment">+</button>
                    </div>
                </div>

                <button class="addToCart"><i class="fa-solid fa-cart-arrow-down"></i> Add To Cart</button>
            </article>
        </div>
    </template>
